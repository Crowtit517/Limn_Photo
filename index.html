<!DOCTYPE html>
<html dir="ltr" lang="ko">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
	<title>Limn - 이미지 편집기</title>
	<meta name="description" content="개인용 이미지 편집기 (miniPaint 기반)" />
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=0" />
	<link rel="icon" type="image/png" sizes="32x32" href="images/brand/limn-32.png">
	<link rel="icon" type="image/png" sizes="16x16" href="images/brand/limn-16.png">
	<link rel="icon" sizes="192x192" href="images/favicon.png">
	<link rel="apple-touch-icon" href="images/brand/limn-192.png">

	<script src="dist/bundle.js"></script>
</head>
<body>
	<div class="limn_splash" id="limn_splash" role="status" aria-label="Limn 시작 중">
		<svg class="mark" viewBox="0 0 96 96" aria-hidden="true">
			<rect class="tile" width="96" height="96" rx="20" fill="#1C1F26"/>
			<text class="letters" x="48" y="60" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="44">Lm</text>
			<rect class="underline" x="26" y="70" width="44" height="4" rx="1" fill="#E0B25A"/>
		</svg>
		<div class="name">Limn</div>
		<div class="meaning">상상을 이미지로 담다</div>
		<div class="foot">
			<div class="bar"><i id="limn_splash_bar"></i></div>
			<div class="status" id="limn_splash_status"></div>
			<div class="meta">버전 0.1.0 · © 2026 Crowtit517</div>
		</div>
	</div>
	<script>window.__limn_splash_start = performance.now();</script>
	<div class="wrapper">

		<nav aria-label="Main Menu" class="main_menu" id="main_menu"></nav>
		
		<div class="submenu">
			<a class="logo" href="#">Limn</a>
			<div class="block attributes" id="action_attributes"></div>
			<button class="undo_button" id="undo_button" type="button">
				<span class="sr_only">Undo</span>
			</button>
		</div>
		
		<div class="sidebar_left" id="tools_container"></div>


		<div class="middle_area" id="middle_area">

			<canvas class="ruler_left" id="ruler_left"></canvas>
			<canvas class="ruler_top" id="ruler_top"></canvas>

			<div class="main_wrapper" id="main_wrapper">
				<div class="canvas_wrapper" id="canvas_wrapper">
					<div id="mouse"></div>
					<div class="transparent-grid" id="canvas_minipaint_background"></div>
					<canvas id="canvas_minipaint">
						<div class="trn error">
							Your browser does not support canvas or JavaScript is not enabled.
						</div>
					</canvas>
				</div>
			</div>
		</div>

		<div class="sidebar_right">
			<div class="preview block">
				<h2 class="trn toggle" data-target="toggle_preview">Preview</h2>
				<div id="toggle_preview"></div>
			</div>
			
			<div class="colors block">
				<h2 class="trn toggle" data-target="toggle_colors">Colors</h2>
				<div class="content" id="toggle_colors"></div>
			</div>
			
			<div class="block" id="info_base">
				<h2 class="trn toggle toggle-full" data-target="toggle_info" data-collapsed="1">Information</h2>
				<div class="content" id="toggle_info"></div>
			</div>
			
			<div class="details block" id="details_base">
				<h2 class="trn toggle toggle-full" data-target="toggle_details" data-collapsed="1">Layer details</h2>
				<div class="content details-content" id="toggle_details"></div>
			</div>
			
			<div class="history block" id="history_base">
				<h2 class="toggle toggle-full" data-target="toggle_history">작업 내역</h2>
				<div class="content" id="toggle_history"><div id="history_list"></div></div>
			</div>

			<div class="layers block">
				<h2 class="trn">Layers</h2>
				<div class="content" id="layers_base"></div>
			</div>
		</div>
	</div>
	<div class="mobile_menu">
		<button class="left_mobile_menu" id="left_mobile_menu_button" type="button">
			<span class="sr_only">Toggle Menu</span>
		</button>
		<button class="right_mobile_menu" id="mobile_menu_button" type="button">
			<span class="sr_only">Toggle Menu</span>
		</button>
	</div>
	<div class="hidden" id="tmp"></div>
	<div id="popups"></div>
</body>
</html>
